document.addEventListener("keydown", e => {
  const overlayOpen = !$("statsScreen").classList.contains("hide") || !$("gameover").classList.contains("hide") || !$("dcResult").classList.contains("hide") || paused;
  if (overlayOpen) return;
  if ($("splash").classList.contains("hide") === false) { if (e.key === "Enter") $("btnPlay").click(); return; }
  if (e.key >= "0" && e.key <= "9") press(e.key);
  else if (e.key === "Backspace") del();
  else if (e.key === "Enter") validate();
  else if (e.key === "-") press("-");
});

/* ---------- Son doux & vibration (Web Audio, sans fichier externe) ---------- */
let soundEnabled = localStorage.getItem("enigmus_sound") !== "0";
let vibrationEnabled = localStorage.getItem("enigmus_vibrate") !== "0";
let ambientEnabled = localStorage.getItem("enigmus_ambient") === "1";   // ambiance : OFF par défaut
let audioCtx = null;
// Volumes globaux. Les effets dominent NETTEMENT ; l'ambiance reste audible mais en simple musique de FOND (demande user).
const SFX_LEVEL = 2.8;      // gain maître de TOUS les effets sonores (bien au-dessus de l'ambiance)
const AMB_LEVEL = 0.08;     // musique d'ambiance : très discrète, en fond sonore
let sfxGain = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (audioCtx && !sfxGain) { sfxGain = audioCtx.createGain(); sfxGain.gain.value = SFX_LEVEL; sfxGain.connect(audioCtx.destination); }
  } catch (e) {}
}
function tone(freq, start, dur, vol, type, endFreq) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + start, osc = audioCtx.createOscillator(), g = audioCtx.createGain();
  osc.type = type || "sine"; osc.frequency.setValueAtTime(freq, t0);
  if (endFreq && endFreq !== freq) osc.frequency.linearRampToValueAtTime(endFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(sfxGain || audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
function soundCorrect() { if (!soundEnabled) return; ensureAudio(); tone(660, 0, 0.16, 0.11); tone(988, 0.10, 0.22, 0.09); }  // deux notes douces montantes
// Fanfare de TROPHÉE : arpège ascendant joyeux (do–mi–sol–do), note finale tenue.
function soundTrophy() {
  if (!soundEnabled) return; ensureAudio();
  tone(523, 0, 0.16, 0.10, "triangle");
  tone(659, 0.12, 0.16, 0.10, "triangle");
  tone(784, 0.24, 0.18, 0.10, "triangle");
  tone(1047, 0.38, 0.34, 0.11, "triangle");
}
// Jalon de niveau (défi franchi) : deux notes montantes, plus discrètes.
function soundLevelUp() {
  if (!soundEnabled) return; ensureAudio();
  tone(659, 0, 0.14, 0.09, "triangle");
  tone(988, 0.11, 0.22, 0.10, "triangle");
}
// Bonne réponse EN SÉRIE : la note monte d'un demi-ton à chaque palier de combo (très satisfaisant).
function soundCombo(n) {
  if (!soundEnabled) return; ensureAudio();
  const steps = Math.min(Math.max(n - 1, 1), 12);
  const f = 523.25 * Math.pow(2, steps / 12);
  tone(f, 0, 0.13, 0.10, "triangle");
  tone(f * 1.5, 0.06, 0.15, 0.06, "triangle");
}
function soundWrong() {
  // Buzzer d'erreur volontairement dans le médium (le 196 Hz d'avant était inaudible sur
  // les petits haut-parleurs de téléphone) : onde carrée descendante, deux impulsions.
  if (soundEnabled) {
    ensureAudio();
    tone(340, 0,    0.16, 0.22, "square", 250);
    tone(250, 0.15, 0.22, 0.22, "square", 150);
  }
  if (vibrationEnabled && navigator.vibrate) { try { navigator.vibrate([70, 40, 70]); } catch (e) {} }
}
/* Musique d'AMBIANCE : morceaux CC0 de Komiku (domaine public), UN PAR MODE — fichiers MP3 dans
   music/, joués EN BOUCLE. Zen = « De l'herbe sous les pieds » · Classique = « Champ de tournesol »
   · Chrono & Défi = « Cliff Road Fight ». Volume via AMB_LEVEL (0..1), fondus d'entrée/sortie. */
const AMB_SRC = {
  zen:       "music/zen.mp3",
  classique: "music/normal.mp3",
  chrono:    "music/active.mp3",
  defi:      "music/active.mp3"
};
// ⚠️ Audio & iOS : (1) iOS Safari IGNORE `HTMLAudioElement.volume` ; (2) `createMediaElementSource` est MUET sur iOS.
// → On lit la musique via **Web Audio pur** : on décode le mp3 (decodeAudioData) et on le joue en boucle par un
// AudioBufferSourceNode branché sur un GainNode (ambGain). C'est EXACTEMENT le chemin des effets (oscillateurs), donc
// le son ET le volume FONCTIONNENT sur iOS. Repli sur un simple <audio> si le décodage/le fetch échoue (ex. WebView
// Android bloque fetch(file://) — mais là, a.volume fonctionne de toute façon).
let ambientAudio = null;          // drapeau « ambiance active » (gardé pour setMode)
let ambGain = null, ambNode = null, ambHtml = null, ambToken = 0;
const ambBuffers = {};            // cache des buffers décodés, par URL
function ensureAmbGain() {
  if (!audioCtx) return null;
  if (!ambGain) { ambGain = audioCtx.createGain(); ambGain.gain.value = AMB_LEVEL; ambGain.connect(audioCtx.destination); }
  ambGain.gain.value = AMB_LEVEL;
  return ambGain;
}
function startAmbient() {
  if (!ambientEnabled || ambientAudio) return;
  ensureAudio();                                          // garantit audioCtx + resume (geste utilisateur)
  ambientAudio = true;                                    // marque l'ambiance comme active
  const src = AMB_SRC[mode] || AMB_SRC.classique;         // un morceau selon le mode de jeu
  const token = ++ambToken;                              // pour annuler un chargement si stop/mode change entre-temps
  const g = ensureAmbGain();
  const playBuffer = (buf) => {
    if (token !== ambToken || !ambientEnabled) return;   // annulé entre-temps
    try {
      const node = audioCtx.createBufferSource();
      node.buffer = buf; node.loop = true; node.connect(g);
      node.start(0); ambNode = node;
    } catch (e) { startAmbientHtml(src, token); }
  };
  if (audioCtx && g && audioCtx.decodeAudioData) {
    if (ambBuffers[src]) { playBuffer(ambBuffers[src]); return; }
    fetch(src).then(r => r.arrayBuffer())
      .then(ab => audioCtx.decodeAudioData(ab))
      .then(buf => { ambBuffers[src] = buf; playBuffer(buf); })
      .catch(() => startAmbientHtml(src, token));         // repli (ex. WebView Android)
  } else {
    startAmbientHtml(src, token);
  }
}
function startAmbientHtml(src, token) {                    // repli sans Web Audio (a.volume marche hors iOS)
  if (token !== ambToken || !ambientEnabled) return;
  try {
    const a = new Audio(src); a.loop = true; a.volume = AMB_LEVEL; a.preload = "auto";
    ambHtml = a; a.play().catch(() => {});
  } catch (e) {}
}
function stopAmbient() {
  ambToken++;                                            // invalide tout décodage/chargement async en cours
  ambientAudio = null;
  if (ambNode) { try { ambNode.stop(); } catch (e) {} try { ambNode.disconnect(); } catch (e) {} ambNode = null; }   // arrêt Web Audio immédiat
  if (ambHtml) { const a = ambHtml; ambHtml = null; try { a.pause(); } catch (e) {} try { a.src = ""; if (a.load) a.load(); } catch (e) {} }
}
function updateToggles() {
  const st = w => `<span class="tgl-state">${w}</span>`;   // mot d'état à largeur fixe → bouton stable
  $("btnSound").innerHTML = "🔊 Son : " + st(soundEnabled ? "activé" : "coupé");
  $("btnSound").classList.toggle("off", !soundEnabled);
  $("btnVibrate").innerHTML = "📳 Vibration : " + st(vibrationEnabled ? "activée" : "coupée");
  $("btnVibrate").classList.toggle("off", !vibrationEnabled);
  $("btnAmbiance").innerHTML = "🎵 Ambiance : " + st(ambientEnabled ? "activée" : "coupée");
  $("btnAmbiance").classList.toggle("off", !ambientEnabled);
}
$("btnSound").addEventListener("click", () => {
  soundEnabled = !soundEnabled; localStorage.setItem("enigmus_sound", soundEnabled ? "1" : "0"); updateToggles();
  if (soundEnabled) { ensureAudio(); tone(880, 0, 0.12, 0.09); }        // aperçu du son
});
$("btnVibrate").addEventListener("click", () => {
  vibrationEnabled = !vibrationEnabled; localStorage.setItem("enigmus_vibrate", vibrationEnabled ? "1" : "0"); updateToggles();
  if (vibrationEnabled && navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
});
$("btnAmbiance").addEventListener("click", () => {
  ambientEnabled = !ambientEnabled; localStorage.setItem("enigmus_ambient", ambientEnabled ? "1" : "0"); updateToggles();
  if (ambientEnabled) { ensureAudio(); startAmbient(); } else stopAmbient();
});

/* init
   NB : le verrou par mot de passe (date d'installation AAAAMMJJ, une seule fois) est
   géré NATIVEMENT côté Android (MainActivity), affiché AVANT le chargement du jeu. */
$("brandBadge").innerHTML = logoEnigmus(40);  // en-tête du jeu : badge « E? » (identité Enigmus)
$("splashLogo").innerHTML = logoEbss(120);    // écran « à propos » : monogramme EBSS authentique
loadState();                                  // charge la progression du mode par défaut (Classique)
$("bestLabel").textContent = best;
buildKeypad();
updateToggles();
// Vibration absente de la plateforme (iPhone : Apple n'expose pas navigator.vibrate) → bouton GRISÉ + désactivé
// (visible mais inactif), sans aucune mention.
if (!navigator.vibrate) { const bv = $("btnVibrate"); bv.disabled = true; bv.style.opacity = "0.4"; bv.style.cursor = "default"; }
updateModeUI();
setupSplash();

// Service worker : hors-ligne pour la version PWA iPhone. Ne s'active que sur https
// (donc inerte dans l'APK/Windows en file://). Le fichier sw.js n'existe que dans le dossier iPhone.
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
